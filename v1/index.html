<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前端视觉资源导航</title>
<link rel="icon" href="data:,">
<meta name="description" content="前端视觉、UI 组件、动效与落地页灵感网站合集，带中文简介，可搜索筛选。">
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1c1b19;--ink2:#5d5a54;--ink3:#8f8b83;--line:#e6e3dc;--accent:#2f5bea;--chip:#efede7;--rec:#b4540c;--recbg:#fdf0e3;--warn:#a1352b;--warnbg:#fbe9e6}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1b1b1a;--ink:#ecebe7;--ink2:#b3b0a8;--ink3:#86837c;--line:#2c2b29;--accent:#7d9bff;--chip:#262624;--rec:#f2a35c;--recbg:#33251a;--warn:#f08f84;--warnbg:#36201d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:48px 20px 40px}
header h1{font-size:30px;letter-spacing:-.01em;margin:0 0 6px;font-weight:650}
header p{margin:0;color:var(--ink2)}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 0 12px;margin-top:20px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);outline:none}
.search:focus{border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spacer{flex:1}
select{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:8px;font-size:13px}
.count{color:var(--ink3);font-size:13px}
h2.group{font-size:15px;font-weight:600;color:var(--ink2);margin:32px 0 12px;display:flex;gap:8px;align-items:baseline}
h2.group span{color:var(--ink3);font-weight:400;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{position:relative;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ink3);transform:translateY(-1px)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{margin:0;font-size:17px;font-weight:620}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover,.card:hover h3 a{color:var(--accent)}
.card h3 a::after{content:"";position:absolute;inset:0;border-radius:14px;z-index:1}
.card h3 a:focus-visible{outline:none}.card:focus-within{border-color:var(--accent)}
.url{font-size:12px;color:var(--ink3);word-break:break-all}
.badge{font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;font-weight:600}
.badge.rec{background:var(--recbg);color:var(--rec)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.desc{margin:0;color:var(--ink2);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;background:var(--chip);color:var(--ink2);padding:1px 8px;border-radius:5px}
.meta{font-size:12.5px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto;display:grid;gap:3px}
.meta b{color:var(--ink3);font-weight:500;margin-right:4px}
.meta a{color:var(--accent);text-decoration:none;position:relative;z-index:2}
.note{font-size:12.5px;color:var(--ink3)}
.empty{color:var(--ink3);text-align:center;padding:60px 0}
footer{margin-top:48px;color:var(--ink3);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--ink2)}
</style>
</head>
<body>
<div style="background:#2f5bea;color:#fff;text-align:center;padding:8px 12px;font-size:13px">你正在看旧版 v1（2026-11-11 保存） · <a href="/" style="color:#fff;font-weight:600">回到最新版 →</a></div>
<div class="wrap">
<header>
<h1>前端视觉资源导航</h1>
<p>UI 组件库、动效库和网页灵感画廊合集，每条都附中文简介、价格和出处，可以搜索和按分类筛选。</p>
</header>

<div class="controls">
<input id="q" class="search" type="search" placeholder="搜索名称、简介或标签，例如：动效、shadcn、免费" autocomplete="off">
<div class="row" id="chips"></div>
<div class="row">
<label class="count" for="sort">排列方式</label>
<select id="sort">
<option value="group">按分类分组</option>
<option value="rec">推荐优先</option>
<option value="name">按名称</option>
</select>
<span class="spacer"></span>
<span class="count" id="count"></span>
</div>
</div>

<main id="list"></main>

<footer>
最后更新：2026-11-11 · 价格和数量以各网站当天页面为准 · 出处：
<a href="https://x.com/khyssabc/status/2120050574410269180" target="_blank" rel="noopener">@khyssabc</a>、
<a href="https://x.com/chatgptastra/status/2120099245697147353" target="_blank" rel="noopener">@chatgptastra</a>
· 无追踪、无需登录
</footer>
</div>

<script>
// ===== 数据：新增条目时在这里加一项即可 =====
// category 取值需在 CATEGORIES 中；rec: true 显示"推荐"；warn: 文本会显示警示徽章
const SOURCES = {
  khyssabc: { label: "@khyssabc", url: "https://x.com/khyssabc/status/2120050574410269180" },
  chatgptastra: { label: "@chatgptastra", url: "https://x.com/chatgptastra/status/2120099245697147353" }
};
const CATEGORIES = ["组件库", "动效", "灵感画廊", "落地页"];

const RESOURCES = [
  {
    name: "shadcn/ui", url: "https://ui.shadcn.com", category: "组件库", rec: true,

    tags: ["组件库", "React", "Tailwind", "AI 友好", "免费", "开源"],
    price: "免费，MIT 开源（GitHub 约 12.8 万星）",
    note: "支持 npx shadcn 命令安装；官方 MCP 可接入 Claude Code、Cursor、Codex。",
    source: "khyssabc"
  },
  {

    desc: "带动效的 React / React Native 组件库，基于 Motion + Tailwind，复制即用；含组件、区块、图表和 AI Agent 界面。",
    tags: ["组件库", "动效", "React", "React Native", "Tailwind", "AI 友好", "免费", "付费"],
    price: "免费版 MIT 可商用；Pro 网页版 $129 起，移动版 $149，单个模板 $39–$99",
    note: "首页标注 157 个 React 组件、73 个 React Native 组件；用 shadcn CLI 安装，Pro 提供 Agent Skill / MCP。",
    source: "khyssabc"
  },
  {
    name: "Rare UI", url: "https://rareui.com", category: "组件库",
    desc: "小众、有辨识度的 React 动画组件合集（如流体光球、OTP 输入），适合做作品集或想让页面显得与众不同。",
    tags: ["组件库", "动效", "React", "AI 友好", "免费", "开源"],
    price: "免费开源",
    note: "首页标注 28+ 个组件，每个组件一个文件；可用 shadcn CLI 或 MCP 安装。",
    source: "khyssabc"
  },
  {
    name: "Beautiful UI", url: "https://beautifului.dev", category: "组件库",
    desc: "专为 AI 产品设计的界面组件：思考过程、流式回答、审批卡片、工具调用、任务状态、对话框、提示输入栏等，可复制代码。",
    tags: ["组件库", "AI 界面", "React", "AI 友好", "免费", "开源"],
    price: "免费，页脚标注 MIT License",
    note: "官网未见具体组件总数或 CLI 安装命令。",
    source: "khyssabc"
  },
  {
    name: "Transitions.dev", url: "https://transitions.dev", category: "动效", rec: true,
    desc: "专注 UI 过渡动画：43+ 个精调过渡效果，加上给 AI 编程助手用的动效 Skill，和能扫描代码库、给动效打分并提 PR 修复的 Motion Agent。",
    tags: ["动效", "React", "Next.js", "AI 友好", "免费", "付费"],
    price: "免费版 $0（核心库 + Skill + 每月 100 积分）；Pro $12/月；Business $59/月（5 席）",
    note: "Skill 支持 Claude Code、Cursor、Codex；Motion Agent 用 npx transitions-agent 运行。",
    source: "khyssabc"
  },
  {
    name: "motion-prompt", url: "https://showheyohtaki.github.io/motion-prompt/", category: "动效", rec: true,
    desc: "192 个有专业名称的动效，每个都有在线演示和可直接复制给 AI 的提示词，解决“跟 AI 说不清想要什么动效”的问题。",
    tags: ["动效", "提示词", "AI 友好", "免费", "开源"],
    price: "免费，MIT 开源（GitHub 约 1.9k 星）",
    note: "可装成 Skill：npx skills add showheyohtaki/motion-prompt；仓库 github.com/showheyohtaki/motion-prompt",
    source: "chatgptastra"
  },
  {
    name: "landing.love", url: "https://www.landing.love/", category: "灵感画廊", rec: true,
    desc: "收录 2267 个网站，每个都录了从顶滚到底的整页视频，另有 11,712 段区块动效片段，看动效和交互最直观。",
    tags: ["灵感画廊", "动效", "落地页", "免费", "付费"],
    price: "浏览免费；Pro $9/月",
    note: "48 个分类。注意要用 https://www 访问，http 地址会报 500。",
    source: "chatgptastra"
  },
  {
    name: "Curated", url: "https://curated.design", category: "灵感画廊", rec: true,
    desc: "约 3000 个真实上线网站和约 3400 个区块页面，可按行业、风格、区块（首屏、定价、页脚等）浏览。",
    tags: ["灵感画廊", "落地页", "AI 友好", "免费", "付费"],
    price: "浏览免费；Pro $9/月（7 天试用）",
    note: "Pro 可导出 design.md，并提供接入 Claude Code / Cursor / Codex 的 MCP。",
    source: "chatgptastra"
  },
  {
    name: "Minimal Gallery", url: "https://minimal.gallery", category: "灵感画廊", rec: true,
    desc: "2013 年起运营，收录 3038 个网站、193 个模板、106 个工具，几乎每天更新；以个人站和作品集为主，适合练排版审美。",
    tags: ["灵感画廊", "作品集", "免费"],
    price: "免费",
    source: "chatgptastra"
  },
  {
    name: "Recent（原 Godly）", url: "https://recent.design", category: "灵感画廊",
    desc: "原 Godly 改名而来，收录 1292 个作品，除网页外还有品牌、动效、插画和海报，适合每天刷一刷。",
    tags: ["灵感画廊", "动效", "品牌", "免费"],
    price: "免费",
    note: "旧地址 godly.website 目前跳转失效（500），请直接访问 recent.design。",
    source: "chatgptastra"
  },
  {
    name: "Landingfolio", url: "https://www.landingfolio.com/", category: "落地页",
    desc: "961 个落地页、4652 个真实区块示例，另有“800+”可复制的 Tailwind / Webflow / Figma 组件，适合直接拿组件改。",
    tags: ["落地页", "灵感画廊", "Tailwind", "Figma", "付费"],
    price: "$49/年，或买断 $249",
    source: "chatgptastra"
  },
  {
    name: "Landingly", url: "https://www.landingly.co/", category: "落地页", warn: "不推荐 / 待观察",
    desc: "落地页灵感和 Figma 模板网站，但首页案例数显示为 0，定价页 404，目前内容不完整。",
    tags: ["落地页", "Figma"],
    price: "未知（定价页打不开）",
    source: "chatgptastra"
  }
];
// ===== 数据结束 =====

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let active = "全部";

function renderChips() {
  const all = ["全部", ...CATEGORIES, "推荐", "免费", "AI 友好"];
  $("#chips").innerHTML = all.map(c => `<button class="chip" aria-pressed="${c === active}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { active = b.dataset.c; renderChips(); render(); });
}

function match(r) {
  if (active === "推荐" && !r.rec) return false;
  if (CATEGORIES.includes(active) && r.category !== active) return false;
  if ((active === "免费" || active === "AI 友好") && !r.tags.includes(active)) return false;
  const q = $("#q").value.trim().toLowerCase();
  if (!q) return true;
  const hay = [r.name, r.url, r.desc, r.category, r.price, r.note || "", ...r.tags].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}

function card(r) {
  const src = SOURCES[r.source];
  const host = r.url.replace(/^https?:\/\//, "").replace(/\/$/, "");
  const badge = r.warn ? `<span class="badge warn">${esc(r.warn)}</span>` : r.rec ? `<span class="badge rec">推荐</span>` : "";
  return `<article class="card">
    <div class="top"><div><h3><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)} ↗</a></h3><div class="url">${esc(host)}</div></div>${badge}</div>
    <p class="desc">${esc(r.desc)}</p>
    ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
    <div class="tags">${r.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    <div class="meta"><div><b>价格</b>${esc(r.price)}</div>
    <div><b>出处</b><a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.label)} 的帖子</a></div></div>
  </article>`;
}

function render() {
  const mode = $("#sort").value;
  let items = RESOURCES.filter(match);
  $("#count").textContent = `共 ${items.length} / ${RESOURCES.length} 个`;
  if (!items.length) { $("#list").innerHTML = `<div class="empty">没有找到匹配的网站，换个关键词试试。</div>`; return; }
  if (mode === "group") {
    $("#list").innerHTML = CATEGORIES.map(c => {
      const g = items.filter(r => r.category === c);
      return g.length ? `<h2 class="group">${esc(c)}<span>${g.length} 个</span></h2><div class="grid">${g.map(card).join("")}</div>` : "";
    }).join("");
  } else {
    items = [...items].sort(mode === "rec"
      ? (a, b) => (b.rec ? 1 : 0) - (a.rec ? 1 : 0) || (a.warn ? 1 : 0) - (b.warn ? 1 : 0)
      : (a, b) => a.name.localeCompare(b.name, "zh"));
    $("#list").innerHTML = `<div class="grid" style="margin-top:24px">${items.map(card).join("")}</div>`;
  }
}

$("#q").addEventListener("input", render);
$("#sort").addEventListener("change", render);
renderChips(); render();
</script>
</body>
</html>
